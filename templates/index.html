<html lang="pt">

            gap: 20px;
        }

            margin-bottom: 15px;

        }

        .botao {

            font-weight: bold;
        }

        .post {
            background: white;
            border-radius: 10px;
            padding: 18px;
            margin-bottom: 15px;
            box-shadow: 0 1px 3px #ddd;
        }

        .post-topo {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .mini-foto {

            height: 45px;

            background: #1877f2;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .acoes {
            border-top: 1px solid #ddd;
            margin-top: 15px;
            padding-top: 10px;
            display: flex;
            justify-content: space-around;
        }

        .acoes button {
            border: none;
            background: none;
            cursor: pointer;

            color: #65676b;
        }

        .curso {

            margin-bottom: 15px;
            box-shadow: 0 1px 3px #ddd;
        }

            color: #1877f2;
            margin-bottom: 8px;
        }
